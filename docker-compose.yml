
services:
  web:
    build: .
    command: >
      sh -c "poetry run python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/code
      - static_volume:/code/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - ./.env

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env
    ports:
      - "5432:5432"

  redis:
    image: redis:6

  celery:
    build: .
    command: >
      bash -c "celery -A config worker -l INFO --concurrency=500 --pool=gevent"
    env_file:
      - .env
    volumes:
      - ./app:/app
    depends_on:
      - redis


  celery_beat:
    build: .
    env_file:
      - .env
    volumes:
      - ./app:/app
    command: >
      bash -c "celery -A config beat --loglevel=info"
    depends_on:
      - redis

volumes:
  postgres_data:
  static_volume:
